name: Static Code Checking CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 (Style Check)
        run: |
          echo "=== 🔍 QUÉT LỖI FLAKE8 ==="
          flake8 bank_service.py --exit-zero

      - name: Run Bandit (Security Scan)
        run: |
          echo "=== 🛡️ QUÉT BẢO MẬT BANDIT ==="
          bandit -r bank_service.py -f txt || true

      - name: Check AI Agent Report (CI/CD Gate)
        run: |
          echo "=== 🤖 CHẠY KIỂM TRA BÁO CÁO TỪ AI AGENT ==="
          python -c "
          import json, sys
          with open('agent_report.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          criticals = [i for i in data.get('findings', []) if i.get('severity') == 'CRITICAL']
          if criticals:
              print('❌ [CI/CD FAILED] TỰ ĐỘNG CHẶN MERGE REQUEST!')
              for err in criticals:
                  print(f'🚨 Lỗi tại hàm {err[\"target_function\"]}: {err[\"description_vi\"]}')
              sys.exit(1)
          print('✅ [CI/CD PASSED] Không có lỗi logic nghiêm trọng.')
          "
