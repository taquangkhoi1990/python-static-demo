name: Static Code Checking CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Flake8
        run: |
          flake8 bank_service.py || true

      - name: Run Bandit
        run: |
          bandit -r bank_service.py || true

      - name: Check AI Agent Report (CI/CD Gate)
        run: |
          python -c "import json, sys; data=json.load(open('agent_report.json', encoding='utf-8')); criticals=[i for i in data.get('findings',[]) if i.get('severity')=='CRITICAL']; print('❌ [CI/CD FAILED] TỰ ĐỘNG CHẶN MERGE!') if criticals else print('✅ PASSED'); sys.exit(1) if criticals else sys.exit(0)"
